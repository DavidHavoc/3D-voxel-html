<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>3D Voxel Sculptor</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="app">
            <!-- Control Panel -->
            <div class="sidebar">
                <h1 class="title">3D Voxel Sculptor</h1>

                <div class="field">
                    <label class="field-label">Width (1-32)</label>
                    <input
                        type="range"
                        id="width"
                        min="1"
                        max="32"
                        value="5"
                        class="range"
                        oninput="document.getElementById('widthValue').innerText = this.value"
                    />
                    <span id="widthValue" class="value">5</span>
                </div>

                <div class="field">
                    <label class="field-label">Height (1-32)</label>
                    <input
                        type="range"
                        id="height"
                        min="1"
                        max="32"
                        value="5"
                        class="range"
                        oninput="document.getElementById('heightValue').innerText = this.value"
                    />
                    <span id="heightValue" class="value">5</span>
                </div>

                <div class="field">
                    <label class="field-label">Depth (1-32)</label>
                    <input
                        type="range"
                        id="depth"
                        min="1"
                        max="32"
                        value="5"
                        class="range"
                        oninput="document.getElementById('depthValue').innerText = this.value"
                    />
                    <span id="depthValue" class="value">5</span>
                </div>

                <div class="field">
                    <label class="field-label">Shape</label>
                    <select id="shape" class="select">
                        <option value="cube">Cube</option>
                        <option value="sphere">Sphere</option>
                        <option value="circle">Circle</option>
                        <option value="cylinder">Cylinder</option>
                        <option value="cone">Cone</option>
                        <option value="pyramid">Square Pyramid</option>
                    </select>
                </div>

                <button id="generateBtn" class="btn-accent">Generate Shape</button>

                <div class="hint">
                    <p>Controls:</p>
                    <p>• Left-click + drag to rotate</p>
                    <p>• Right-click + drag to pan</p>
                    <p>• Scroll to zoom</p>
                </div>

                <div id="stats" class="stats">
                    <p>Voxels: <span id="voxelCount">0</span></p>
                </div>
            </div>

            <!-- 3D Canvas -->
            <div class="viewport">
                <div id="canvas-container" class="canvas-container"></div>

                <!-- Loading indicator -->
                <div id="loading" class="overlay hidden">
                    <div class="overlay-content">
                        <div class="spinner"></div>
                        <p>Generating shape...</p>
                    </div>
                </div>

                <!-- Error message -->
                <div id="errorMsg" class="error-toast hidden">Error message here</div>
            </div>
        </div>

        <!--
        Application logic is loaded as an ES module in FEAT-002:
        the pure voxel generators (src/voxel-generators.js), the
        self-contained raw-WebGL renderer (src/renderer.js), and the
        DOM wiring (src/app.js). No external scripts or CDNs are used.
    --></body>
</html>
